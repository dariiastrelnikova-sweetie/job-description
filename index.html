<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page error</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --line: #333333;
    --text: #FFFFFF;
    --muted: #999999;
    --muted-2: #666666;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --heading-font: "Onest", Arial, sans-serif;
    --body-font: "Inter", Arial, sans-serif;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  :root:not([data-theme="light"]) {
    /* black-on-white/white-on-black is the brand's own palette,
       so this page keeps the dark variant regardless of system scheme */
  }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
    height: 100%;
  }

  * { box-sizing: inherit; }

  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body-font);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
  }

  .frame {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  h1 {
    font-family: var(--heading-font);
    font-size: clamp(36px, 9vw, 60px);
    line-height: 1;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0 0 18px;
    color: var(--text);
  }

  .sub {
    font-family: var(--body-font);
    font-size: 14px;
    line-height: 1.6;
    color: #CCCCCC;
    margin: 0 0 34px;
  }

  .prompt {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 13px;
    color: #C1DC55;
  }

  .prompt .arrow {
    color: #C1DC55;
  }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: #C1DC55;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
    vertical-align: -2px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }

  @media (max-width: 420px) {
    .frame { max-width: 100%; }
  }
</style>
</head>
<body>
  <div class="frame">
    <h1>ERROR</h1>

    <p class="sub">This page didn't load the way it was supposed to.</p>

    <div class="prompt">
      <span class="arrow">&gt;</span>
      <span>open the developer console<span class="cursor"></span></span>
    </div>
  </div>

  <script>
    (function () {
      var headline = "You dug deeper than most.";
      var message = "That's exactly the kind of people we're looking for.";
      var cta = "Let's talk?";
      var link = "solidgate.com/careers";

      // One console.log with line breaks, so the blocks sit together
      // instead of being split into separate console rows with dividers.
      // line-height is sized to font + padding so the backgrounds don't overlap.
      console.log(
        "%c" + headline + "%c\n%c" + message + "%c\n%c" + cta + "%c\n%c" + link,
        "font-size:21px;font-weight:700;line-height:58px;color:#000000;background:#C1DC55;" +
        "padding:9px 28px;border-radius:8px;font-family:Onest,Arial,sans-serif;",
        "",
        "font-size:18px;font-weight:500;line-height:52px;color:#FFFFFF;background:#000000;" +
        "padding:7px 28px;border-radius:8px;font-family:Inter,Arial,sans-serif;",
        "",
        "font-size:18px;font-weight:600;line-height:52px;color:#FFFFFF;background:#000000;" +
        "padding:7px 28px;border-radius:8px;font-family:Inter,Arial,sans-serif;",
        "",
        "font-size:14px;font-weight:600;line-height:44px;color:#C1DC55;background:#000000;" +
        "padding:5px 28px;border-radius:8px;font-family:ui-monospace,Menlo,monospace;"
      );
    })();
  </script>
</body>
</html>
